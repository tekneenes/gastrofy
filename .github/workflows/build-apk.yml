name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "Creating fallback .env file for build assets..."
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gastrofy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add Job Summary
        run: |
          echo "### 🚀 APK Derleme Başarılı!" >> $GITHUB_STEP_SUMMARY
          echo "Derlenen APK dosyası Artifacts bölümünde **gastrofy-release-apk** olarak hazır." >> $GITHUB_STEP_SUMMARY
